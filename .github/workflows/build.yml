name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Runs are grouped per branch, so a PR push never cancels a build (or the Pages deploy) of main or another PR.
# A newer push to the same PR cancels the older run; on main every run finishes, so each merge gets deployed.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VER=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Install KiCad 7 and CadQuery
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad kicad-footprints
          pip install --break-system-packages cadquery numpy trimesh scipy rtree matplotlib

      - name: Build PCB (KiCad)
        # both variants: the cup board (pcb/vein_base -> fab/) and the ATOMIC Proto Kit board (pcb/vein_base_atomic -> fab/atomic/)
        run: |
          cd pcb && python3 build_pcb.py && cd ..
          fab() {  # $1 = board name, $2 = output dir
            local B=pcb/$1.kicad_pcb N=$2/$1_v$VER
            mkdir -p $2/gerber
            kicad-cli pcb export gerbers -l F.Cu,B.Cu,F.SilkS,B.SilkS,F.Mask,B.Mask,F.Paste,B.Paste,Edge.Cuts --subtract-soldermask -o $2/gerber/ $B
            kicad-cli pcb export drill --format excellon --excellon-separate-th -o $2/gerber/ $B
            kicad-cli pcb export pos --format csv --units mm --side both -o $2/pos.csv $B
            kicad-cli pcb export pdf -l F.Cu,B.Cu,F.SilkS,Edge.Cuts -o ${N}_fitcheck_1to1.pdf $B
            kicad-cli pcb export pdf -l F.Cu,B.Cu,F.SilkS,Edge.Cuts --mirror -o ${N}_fitcheck_1to1_seen_from_below.pdf $B
            kicad-cli pcb export step --subst-models -o ${N}_pcb.step $B
            (cd $2/gerber && zip -q ../$1_v${VER}_gerbers.zip *)
            python3 tools/make_jlc_cpl.py --pos $2/pos.csv --prefix $1_v --outdir $2 --corrections pcb/jlc_cpl_corrections.csv
          }
          fab vein_base fab
          fab vein_base_atomic fab/atomic

      - name: DRC
        run: |
          python3 tools/check_drc.py
          python3 tools/check_drc.py --board pcb/vein_base_atomic.kicad_pcb --report fab/atomic/drc.rpt

      - name: Build Vein Station board (KiCad)
        # both outlines of the same circuit: r10 for the printed enclosure (fab/station/) and r11 for the Takachi
        # PF13-4-9 case (station_board_pf -> fab/station_pf/)
        run: |
          cd pcb/station_board && python3 build_board.py && python3 build_board.py pf && cd ../..
          sfab() {  # $1 = board name, $2 = output dir
            local B=pcb/station_board/$1.kicad_pcb
            mkdir -p $2/gerber
            kicad-cli pcb export gerbers -l F.Cu,B.Cu,F.SilkS,B.SilkS,F.Mask,B.Mask,F.Paste,B.Paste,Edge.Cuts --subtract-soldermask -o $2/gerber/ $B
            kicad-cli pcb export drill --format excellon --excellon-separate-th -o $2/gerber/ $B
            kicad-cli pcb export pos --format csv --units mm --side both -o $2/pos.csv $B
            (cd $2/gerber && zip -q ../$1_v${VER}_gerbers.zip *)
            python3 tools/make_jlc_cpl.py --pos $2/pos.csv --bom pcb/station_board/jlc_bom.csv --prefix $1_v --outdir $2 \
              --corrections pcb/station_board/jlc_cpl_corrections.csv
          }
          sfab station_board fab/station
          sfab station_board_pf fab/station_pf

      - name: Vein Station board DRC
        # silk_edge_clearance: the DB9 footprint's outline silk runs off the board edge; only this board is exempt.
        run: |
          python3 tools/check_drc.py --board pcb/station_board/station_board.kicad_pcb --report fab/station/drc.rpt --ignore silk_edge_clearance
          python3 tools/check_drc.py --board pcb/station_board/station_board_pf.kicad_pcb --report fab/station_pf/drc.rpt --ignore silk_edge_clearance

      - name: Build Vein Unit board (KiCad) + DRC
        run: |
          cd pcb/vein_unit_board && python3 build_board.py && cd ../..
          B=pcb/vein_unit_board/vein_unit_board.kicad_pcb; D=fab/vein_unit
          mkdir -p $D/gerber
          kicad-cli pcb export gerbers -l F.Cu,B.Cu,F.SilkS,B.SilkS,F.Mask,B.Mask,F.Paste,B.Paste,Edge.Cuts --subtract-soldermask -o $D/gerber/ $B
          kicad-cli pcb export drill --format excellon --excellon-separate-th -o $D/gerber/ $B
          kicad-cli pcb export pos --format csv --units mm --side both -o $D/pos.csv $B
          kicad-cli pcb export pdf -l F.Cu,B.Cu,F.SilkS,Edge.Cuts -o $D/vein_unit_board_v${VER}_fitcheck_1to1.pdf $B
          (cd $D/gerber && zip -q ../vein_unit_board_v${VER}_gerbers.zip *)
          python3 tools/make_jlc_cpl.py --pos $D/pos.csv --bom pcb/vein_unit_board/jlc_bom.csv --prefix vein_unit_board_v --outdir $D \
            --corrections pcb/vein_unit_board/jlc_cpl_corrections.csv
          python3 tools/check_drc.py --board $B --report $D/drc.rpt

      - name: Build case (CadQuery)
        run: cd case && python3 build_case.py

      - name: Build 3D preview + interference check
        run: python3 tools/build_viewer.py

      - name: Build Vein Station enclosure + 3D preview + interference check
        run: python3 station/build_station.py

      - name: Build Vein Station SE enclosure + 3D preview + interference check
        run: python3 station/build_station_se.py

      - name: Build Vein Station PF (Takachi PF13-4-9) hole drawings + 3D preview + interference check
        run: python3 station/build_station_pf.py

      - name: Build Vein Unit (finger vein module alone in a small Takachi case) 3D previews + interference check
        run: python3 station/build_vein_unit.py cs && python3 station/build_vein_unit.py sic

      - name: Minimum wall thickness of the printed parts (DMM resin SLA needs 1.0 mm)
        run: python3 tools/check_thickness.py 1.0 case/vein_base_v*_cup.stl station/vein_station_r*_shell.stl station/vein_station_r*_lid.stl

      - uses: actions/upload-artifact@v4
        with:
          name: vein-base-v${{ env.VER }}-fab
          path: |
            pcb/vein_base.kicad_pcb
            pcb/vein_base_atomic.kicad_pcb
            fab/vein_base_v*
            fab/atomic/*
            case/vein_base_v*
            station/vein_station_*
            fab/station/*
            fab/station_pf/*
            fab/vein_unit/*

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    # one Pages deployment at a time; a queued one waits instead of cancelling the running one
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
