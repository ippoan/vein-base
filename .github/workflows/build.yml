name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Runs are grouped per branch, so a PR push never cancels a build (or the Pages deploy) of main or another PR.
# A newer push to the same PR cancels the older run; on main every run finishes, so each merge gets deployed.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VER=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Install KiCad 7 and CadQuery
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad kicad-footprints
          pip install --break-system-packages cadquery numpy trimesh scipy rtree

      - name: Build PCB (KiCad)
        run: |
          N=fab/vein_base_v$VER
          cd pcb && python3 build_pcb.py && cd ..
          mkdir -p fab/gerber
          kicad-cli pcb export gerbers -l F.Cu,B.Cu,F.SilkS,B.SilkS,F.Mask,B.Mask,F.Paste,B.Paste,Edge.Cuts --subtract-soldermask -o fab/gerber/ pcb/vein_base.kicad_pcb
          kicad-cli pcb export drill --format excellon --excellon-separate-th -o fab/gerber/ pcb/vein_base.kicad_pcb
          kicad-cli pcb export pos --format csv --units mm --side both -o fab/pos.csv pcb/vein_base.kicad_pcb
          kicad-cli pcb export pdf -l F.Cu,B.Cu,F.SilkS,Edge.Cuts -o ${N}_fitcheck_1to1.pdf pcb/vein_base.kicad_pcb
          kicad-cli pcb export pdf -l F.Cu,B.Cu,F.SilkS,Edge.Cuts --mirror -o ${N}_fitcheck_1to1_seen_from_below.pdf pcb/vein_base.kicad_pcb
          kicad-cli pcb export step --subst-models -o ${N}_pcb.step pcb/vein_base.kicad_pcb
          (cd fab/gerber && zip -q ../vein_base_v${VER}_gerbers.zip *)
          python3 tools/make_jlc_cpl.py

      - name: DRC
        run: python3 tools/check_drc.py

      - name: Build Vein Station board (KiCad)
        run: |
          cd pcb/station_board && python3 build_board.py && cd ../..
          mkdir -p fab/station/gerber
          kicad-cli pcb export gerbers -l F.Cu,B.Cu,F.SilkS,B.SilkS,F.Mask,B.Mask,F.Paste,B.Paste,Edge.Cuts --subtract-soldermask -o fab/station/gerber/ pcb/station_board/station_board.kicad_pcb
          kicad-cli pcb export drill --format excellon --excellon-separate-th -o fab/station/gerber/ pcb/station_board/station_board.kicad_pcb
          kicad-cli pcb export pos --format csv --units mm --side both -o fab/station/pos.csv pcb/station_board/station_board.kicad_pcb
          (cd fab/station/gerber && zip -q ../station_board_v${VER}_gerbers.zip *)
          python3 tools/make_jlc_cpl.py --pos fab/station/pos.csv --bom pcb/station_board/jlc_bom.csv --prefix station_board_v --outdir fab/station

      - name: Vein Station board DRC
        # silk_edge_clearance: the DB9 footprint's outline silk runs off the board edge; only this board is exempt.
        run: python3 tools/check_drc.py --board pcb/station_board/station_board.kicad_pcb --report fab/station/drc.rpt --ignore silk_edge_clearance

      - name: Build case (CadQuery)
        run: cd case && python3 build_case.py

      - name: Build 3D preview + interference check
        run: python3 tools/build_viewer.py

      - name: Build Vein Station enclosure + 3D preview + interference check
        run: python3 station/build_station.py

      - name: Build Vein Station SE enclosure + 3D preview + interference check
        run: python3 station/build_station_se.py

      - name: Minimum wall thickness of the printed parts (DMM resin SLA needs 1.0 mm)
        run: python3 tools/check_thickness.py 1.0 case/vein_base_v*_cup.stl station/vein_station_r*_shell.stl station/vein_station_r*_lid.stl

      - uses: actions/upload-artifact@v4
        with:
          name: vein-base-v${{ env.VER }}-fab
          path: |
            pcb/vein_base.kicad_pcb
            fab/vein_base_v*
            case/vein_base_v*
            station/vein_station_*
            fab/station/*

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    # one Pages deployment at a time; a queued one waits instead of cancelling the running one
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
